<text x="600.0" y="48" font-size="26" font-weight="bold" text-anchor="middle" fill="#111">PS1/PS2 → USB: ligação ao Raspberry Pi Pico</text>
<text x="600.0" y="72" font-size="14" text-anchor="middle" fill="#555">2 controles simultâneos · DATA, CMD, CLK, 3V3 e GND compartilhados · ATT separado por porta</text>
