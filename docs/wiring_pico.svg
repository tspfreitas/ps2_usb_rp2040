<text x="76" y="700" font-size="13" fill="#333">• Resistor de 1 kΩ entre DATA (GP4) e 3V3: obrigatório (um só, compartilhado pelas duas portas).</text>
<text x="76" y="721" font-size="13" fill="#333">• VCC dos controles sempre em 3V3, nunca em 5 V.</text>
<text x="76" y="742" font-size="13" fill="#333">• Pino 3 (motores) é opcional: ligado ao VBUS (5 V) só para testar a vibração (fraca). *Linha tracejada.</text>
<text x="76" y="763" font-size="13" fill="#333">• ACK (pino 9) e pino 8 não são usados. Confira a ordem dos pinos do seu conector com o multímetro.</text>
<text x="76" y="784" font-size="13" fill="#333">• Outros GND do Pico: pinos 3, 8, 13, 18, 23, 28, 33, 38 (todos servem). Pinos GP2/GP3/GP4 são o SPI0.</text>
